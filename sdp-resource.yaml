# resource yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdp-resource
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdp-resource
  template:
    metadata:
      labels:
        app: sdp-resource
    spec:
      containers:
      - name: resource
        image: sdp-resource:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8100
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "0.25"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: sdp-resource
spec:
  selector:
    app: sdp-resource
  ports:
  - protocol: TCP
    port: 8100
    targetPort: 8100
  type: ClusterIP
