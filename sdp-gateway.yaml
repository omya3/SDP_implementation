# gateway yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdp-gateway
  template:
    metadata:
      labels:
        app: sdp-gateway
    spec:
      containers:
      - name: gateway
        image: sdp-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5005
          protocol: UDP
        - containerPort: 6000
          protocol: UDP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        # === NEW: TLS flags and paths ===
        - name: GATEWAY_TLS_ENABLED
          value: "true"             # enable TLS on client-facing socket
        - name: GATEWAY_MTLS_ENABLED
          value: "false"            # set to "true" if you want mTLS
        - name: GATEWAY_TLS_CERT
          value: "/app/tls/gw_cert.pem"
        - name: GATEWAY_TLS_KEY
          value: "/app/tls/gw_key.pem"
        - name: GATEWAY_CA_CERT
          value: "/app/tls/ca_cert.pem"
        # ================================
        volumeMounts:
        - name: tls
          mountPath: /app/tls
          readOnly: true
        resources:
          requests:
            cpu: "0.5"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
      volumes:
      - name: tls
        secret:
          secretName: sdp-gateway-tls
---
apiVersion: v1
kind: Service
metadata:
  name: sdp-gateway
spec:
  selector:
    app: sdp-gateway
  ports:
  - name: spa
    protocol: UDP
    port: 5005
    targetPort: 5005
  - name: ack
    protocol: UDP
    port: 6000
    targetPort: 6000
  type: ClusterIP
